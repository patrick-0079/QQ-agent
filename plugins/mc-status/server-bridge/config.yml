# ConsoleBridge 配置
#
# ⚠️ token 必填。留空的话插件会**拒绝启动**（fail closed）—— 这个端点会把服务器日志
#    暴露到网络上，没有鉴权就等于把玩家 IP 和聊天内容公开。

# 机器人那边（控制台 → 插件 → 服务器状态 → 日志接口密钥）要填**同一个**值。
# 生成办法举例：随便一段长随机串，或命令行 `openssl rand -hex 24`
token: ""

# 监听端口。别跟服务器端口（25565）、RCON（25575）撞。
port: 25585

# 监听地址。0.0.0.0 = 所有网卡（机器人在另一台机器上时需要）；
# 如果机器人跟服务器在同一台机器，或走内网穿透，可以填 127.0.0.1 更安全。
bind: "0.0.0.0"

# 日志文件相对服务器根目录的路径（Paper/Spigot 的 latest.log 就在这）
logFile: "logs/latest.log"

# 单次最多读多少字节（从文件尾部算）。latest.log 很大也不用担心，不会全读进内存。
maxBytes: 524288

# 默认返回多少行（机器人没带 lines 参数时用）
defaultLines: 200

# 单次最多返回多少行（防滥用）
maxLines: 2000
